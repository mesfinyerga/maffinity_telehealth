version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: telehealth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend/telehealth-api
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/telehealth_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/telehealth-api:/app
      - /app/node_modules
    command: sh -c "npm run migration:run && node dist/main.js"

  doctor-portal:
    build:
      context: ./frontend/doctor-portal
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    volumes:
      - ./frontend/doctor-portal:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev

  patient-app:
    build:
      context: ./frontend/patient-app
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    volumes:
      - ./frontend/patient-app:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    command: npm run dev

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    volumes:
      - ./frontend/admin-dashboard:/app
      - /app/node_modules
    ports:
      - "5175:5175"
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
